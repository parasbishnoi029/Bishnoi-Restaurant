<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bishnoi Restaurant</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #1f1f2e, #2c2c54);
  color: white;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
}

.logo {
  font-size: 22px;
  font-weight: 700;
}

.nav-btn {
  background: #ff7a18;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  color: white;
  cursor: pointer;
}

/* Hero */
.hero {
  height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.hero p {
  opacity: 0.8;
  margin-bottom: 25px;
}

.btn {
  padding: 14px 30px;
  border: none;
  border-radius: 30px;
  background: #ff7a18;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #ff9a3c;
}

/* Features */
.features {
  display: flex;
  justify-content: space-around;
  padding: 40px;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  width: 250px;
}

/* Footer */
.footer {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}

/* Hint popup */
.hint {
  position: fixed;
  bottom: 90px;
  right: 20px;
  background: #ff7a18;
  padding: 12px 16px;
  border-radius: 10px;
  color: white;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  z-index: 9999;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>

</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">Bishnoi Restaurant 🍽️</div>
  <button class="nav-btn" onclick="showHint()">Reserve Table</button>
</div>

<!-- Hero -->
<div class="hero">
  <div>
    <h1>Fine Dining Experience</h1>
    <p>Book your table instantly with our smart assistant</p>
    <button class="btn" onclick="showHint()">Book Now</button>
  </div>
</div>

<!-- Features -->
<div class="features">
  <div class="card">
    <h3>🍴 Quality Food</h3>
    <p>Delicious meals crafted by top chefs</p>
  </div>

  <div class="card">
    <h3>⚡ Instant Booking</h3>
    <p>Reserve your table in seconds</p>
  </div>

  <div class="card">
    <h3>📍 Easy Access</h3>
    <p>Visit us anytime with ease</p>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  © 2026 Bishnoi Restaurant | All Rights Reserved
</div>

<!-- WotNot Chatbot -->
<script src="https://app.wotnot.io/chat-widget/5czhdH2N3tB8071020251196LKoCV6ju.js" defer></script>

<script>
/* 🔥 Auto-open attempt */
window.addEventListener("load", function () {
  setTimeout(() => {
    try {
      let btn = document.querySelector('[class*="chat"], [id*="chat"]');
      if (btn) btn.click();
    } catch (e) {
      console.log("Auto-open failed");
    }

    showHint(); // fallback
  }, 3000);
});

/* 💡 User guidance (ALWAYS works) */
function showHint() {
  const old = document.querySelector(".hint");
  if (old) old.remove();

  const msg = document.createElement("div");
  msg.className = "hint";
  msg.innerText = "👇 Click the chat icon here to reserve your table";

  document.body.appendChild(msg);

  setTimeout(() => msg.remove(), 4000);
}
</script>

</body>
</html>
