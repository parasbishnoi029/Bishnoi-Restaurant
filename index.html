<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bishnoi Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #1f1f2e, #2c2c54);
  color: white;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
}

.logo {
  font-size: 22px;
  font-weight: 700;
}

/* Hero */
.hero {
  height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.hero p {
  opacity: 0.8;
}

/* Features */
.features {
  display: flex;
  justify-content: space-around;
  padding: 40px;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  width: 250px;
}

/* Footer */
.footer {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}

/* 🌑 Overlay Spotlight */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  padding: 80px 30px;
  z-index: 9998;
  animation: fadeIn 0.6s ease;
}

/* 💬 Spotlight Message */
.spotlight-box {
  background: #ff7a18;
  padding: 14px 18px;
  border-radius: 12px;
  color: white;
  font-size: 14px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  animation: slideUp 0.5s ease;
}

/* Animations */
@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

@keyframes slideUp {
  from {transform: translateY(20px); opacity: 0;}
  to {transform: translateY(0); opacity: 1;}
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">Bishnoi Restaurant 🍽️</div>
</div>

<div class="hero">
  <div>
    <h1>Fine Dining Experience</h1>
    <p>Reserve your table instantly with our smart assistant</p>
  </div>
</div>

<div class="features">
  <div class="card">
    <h3>🍴 Quality Food</h3>
    <p>Delicious meals crafted by top chefs</p>
  </div>

  <div class="card">
    <h3>⚡ Instant Booking</h3>
    <p>Reserve your table in seconds</p>
  </div>

  <div class="card">
    <h3>📍 Easy Access</h3>
    <p>Visit us anytime with ease</p>
  </div>
</div>

<div class="footer">
  © 2026 Bishnoi Restaurant | All Rights Reserved
</div>

<!-- WotNot Chatbot -->
<script src="https://app.wotnot.io/chat-widget/5czhdH2N3tB8071020251196LKoCV6ju.js" defer></script>

<script>
window.addEventListener("load", function () {

  // 🔥 Auto-open attempt
  setTimeout(() => {
    try {
      let btn = document.querySelector('[class*="chat"], [id*="chat"]');
      if (btn) btn.click();
    } catch(e){}
  }, 2500);

  // 🌑 Show spotlight overlay
  setTimeout(() => {
    const overlay = document.createElement("div");
    overlay.className = "overlay";

    const box = document.createElement("div");
    box.className = "spotlight-box";
    box.innerText = "👋 Tap here to book your table instantly";

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    // Remove after 5 sec
    setTimeout(() => overlay.remove(), 5000);

    // Click to remove early
    overlay.onclick = () => overlay.remove();

  }, 2000);

});
</script>

</body>
</html>
